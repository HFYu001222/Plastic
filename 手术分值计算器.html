        {name:"美容物理治疗（射频/微波/超声/微针）",score:0.5},
        {name:"激光光电类治疗单次",score:0.5},
        {name:"光动力学治疗-外用光敏剂",score:0.5},
        {name:"光动力学治疗-静脉光敏剂 1.0分/1%TBSA",score:1.0},
        {name:"离子透析治疗 0.2分/1%TBSA",score:0.2},
        {name:"化学剥脱治疗 0.5分/1%TBSA",score:0.5},
        {name:"多汗症治疗 1.0分/每部位",score:1.0},
        {name:"体表肿物切除术≤20cm²",score:1.0},
        {name:"面部瘢痕切除缝合≤10cm",score:1.5},
        {name:"皮肤磨削术≤0.5%TBSA",score:0.5},
        {name:"腋臭大汗腺祛除术（侧）",score:1.0},
        {name:"毛发切取移植（每600毛囊）",score:1.0},
        {name:"皮损刮除术",score:1.0},
        {name:"酒渣鼻切割术",score:1.0},
        {name:"白癜风自体取皮移植术<20cm²",score:2.0},
        {name:"白癜风吸疱/细胞移植治疗术",score:1.0},
        {name:"局部皮瓣转移术≤30cm²",score:1.5}
    ]
};

let totalScore = 0;
let itemList = [];

// 大类联动
document.getElementById('bigCat').addEventListener('change',function(){
    let cat = this.value;
    let subSel = document.getElementById('subItem');
    subSel.innerHTML = '<option value="">请选择具体手术项目</option>';
    if(!cat) return;
    let arr = catLib[cat];
    arr.forEach(item=>{
        let opt = document.createElement('option');
        opt.value = item.score;
        opt.textContent = item.name + " ｜指数：" + item.score;
        subSel.appendChild(opt);
    });
});

// 添加项目
function addItem(){
    let cat = document.getElementById('bigCat').value;
    let subSel = document.getElementById('subItem');
    let itemName = subSel.options[subSel.selectedIndex].text;
    let score = parseFloat(subSel.value);

    if(!cat || !subSel.value){
        alert("请先选择手术大类和具体手术项目");
        return;
    }

    itemList.push({name:itemName,score:score});
    totalScore = itemList.reduce((sum,item)=>sum+item.score,0);
    renderTable();
    calcResult();
}

// 渲染列表
function renderTable(){
    let tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    itemList.forEach((item,idx)=>{
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${idx+1}</td>
            <td>${item.name}</td>
            <td>${item.score.toFixed(1)}</td>
            <td><button class="del-btn" onclick="delItem(${idx})">删除</button></td>
        `;
        tbody.appendChild(tr);
    });
}

// 删除单项
function delItem(idx){
    itemList.splice(idx,1);
    totalScore = itemList.reduce((sum,item)=>sum+item.score,0);
    renderTable();
    calcResult();
}

// 计算总分、分级、超限
function calcResult(){
    document.getElementById('totalScore').innerText = totalScore.toFixed(1);

    let level = "Ⅰ级美容外科手术";
    if(totalScore > 4) level = "Ⅱ级美容外科手术";
    if(totalScore > 7) level = "Ⅲ级美容外科手术";
    if(totalScore > 11) level = "Ⅳ级高风险整形手术";
    document.getElementById('surgeryLevel').innerText = level;

    let tipDom = document.getElementById('limitTip');
    if(totalScore > FIX_LIMIT){
        tipDom.innerText = `已超限！超出 ${(totalScore - FIX_LIMIT).toFixed(1)} 分，不符合管控要求`;
        tipDom.className = 'warn';
    }else{
        tipDom.innerText = `合规未超限，剩余额度 ${(FIX_LIMIT - totalScore).toFixed(1)} 分`;
        tipDom.className = 'normal';
    }
}

// 清空
function clearAll(){
    itemList = [];
    totalScore = 0;
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('totalScore').innerText = '0.0';
    document.getElementById('limitTip').innerText = '--';
    document.getElementById('surgeryLevel').innerText = '--';
    document.getElementById('bigCat').value = '';
    document.getElementById('subItem').innerHTML = '<option value="">先选择上方手术大类</option>';
}
</script>
