<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海2024医美复合手术计算器（肉毒素400U强制限制版）</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{background:#f5f7fa;padding:20px;}
        .container{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;padding:25px;box-shadow:0 2px 15px #ddd;}
        h1{text-align:center;color:#1f2937;margin-bottom:10px;font-size:24px;}
        h2{text-align:center;color:#1f2937;margin-bottom:8px;font-size:18px;}
        h3{text-align:center;color:#374151;margin-bottom:20px;font-size:14px;}
        .hint{background:#eef4ff;padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px;line-height:1.7;color:#333;}
        .select-wrap{display:flex;gap:15px;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #eee;flex-wrap:wrap;}
        select,button{padding:9px 14px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
        button{background:#2563eb;color:#fff;border:none;cursor:pointer;}
        button:hover{background:#1d4ed8;}
        .del-btn{background:#ef4444;margin-left:8px;padding:4px 8px;font-size:12px;border-radius:4px;color:#fff;border:none;cursor:pointer;}
        table{width:100%;border-collapse:collapse;margin:20px 0;}
        th,td{border:1px solid #ddd;padding:10px;text-align:center;font-size:14px;}
        th{background:#f8fafc;}
        .result-box{background:#ecfdf5;padding:18px;border-radius:8px;margin-top:20px;}
        .result-item{font-size:16px;margin:8px 0;}
        .warn{color:#ef4444;font-weight:bold;}
        .normal{color:#059669;font-weight:bold;}
        .check-item{display:flex;align-items:center;gap:6px;font-size:14px;}
        .limit-tip{color:#ef4444;font-size:14px;margin:10px 0;}
    </style>
</head>
<body>
<div class="container">
    <h1>手术/非手术治疗分值计算器</h1>
    <h2>依据#[《上海市医疗美容服务项目分级管理目录（2024）》](上海市医疗美容服务项目分级管理目录.pdf)</h2>
    <h3>上海时光</h3>

    <div class="hint">
        固定规则：三级医疗机构｜肉毒素单日严格上限 <strong>400U</strong>，超量自动拦截
        <br>勾选【非手术计算】= 无麻醉9.0分，不勾选 = 有麻醉12.0分
    </div>

    <div class="select-wrap">
        <select id="bigCat">
            <option value="">请选择手术大类</option>
            <option value="eye">眼部整形</option>
            <option value="nose">鼻部整形</option>
            <option value="maxillofacial">颌面轮廓整形</option>
            <option value="liposuction">脂肪吸脂类</option>
            <option value="fatfill">自体脂肪填充类</option>
            <option value="breast">胸部整形</option>
            <option value="trunk">躯干四肢整形</option>
            <option value="private">私密会阴整形</option>
            <option value="inject">注射类治疗</option>
            <option value="dermatology">美容皮肤科治疗</option>
        </select>

        <select id="subItem">
            <option value="">先选择上方手术大类</option>
        </select>

        <div class="check-item">
            <input type="checkbox" id="noAnesthesia">
            <label for="noAnesthesia">非手术计算（无麻醉监护）</label>
        </div>

        <button onclick="addItem()">添加本次手术项目</button>
        <button onclick="clearAll()">清空全部</button>
    </div>

    <div class="limit-tip">
        肉毒素已用单位：<span id="usedU">0</span> U / 单日最大限制 400 U
    </div>

    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>手术项目全称</th>
                <th>单项指数</th>
                <th>肉毒素用量</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="result-box">
        <div class="result-item">累计治疗指数总分：<span id="totalScore" class="normal">0.0</span></div>
        <div class="result-item">当前限额标准：<span id="currentLimit">12.0 分/次</span></div>
        <div class="result-item">超限合规判定：<span id="limitTip">--</span></div>
        <div class="result-item">复合手术等级判定：<span id="surgeryLevel">--</span></div>
    </div>
</div>

<script>
// 固定常量
const LIMIT_ANES = 12.0;
const LIMIT_NO_ANES = 9.0;
const BOTOX_MAX_U = 400;

// 全项目库（每项固定botoxU）
const catLib = {
    eye:[
        {name:"招风耳矫治术（侧）",score:1.0,botoxU:0},
        {name:"附耳切除整形术（只）",score:0.5,botoxU:0},
        {name:"眉修整术（侧）",score:1.0,botoxU:0},
        {name:"眉部切口上睑提升术（提眉术）",score:1.5,botoxU:0},
        {name:"中老年上睑松弛矫治术",score:1.5,botoxU:0},
        {name:"重睑成形术-切开法",score:1.5,botoxU:0},
        {name:"重睑成形术-埋线法",score:1.0,botoxU:0},
        {name:"重睑成形术-三点法",score:1.0,botoxU:0},
        {name:"上睑脂肪部分祛除术",score:1.0,botoxU:0},
        {name:"重睑修复术（侧）",score:1.0,botoxU:0},
        {name:"内切眼袋",score:1.0,botoxU:0},
        {name:"外切眼袋",score:1.5,botoxU:0},
        {name:"眼袋+眶隔脂肪填泪沟",score:2.0,botoxU:0},
        {name:"内眦成形术",score:0.5,botoxU:0},
        {name:"外眦成形术",score:0.5,botoxU:0}
    ],
    nose:[
        {name:"假体隆鼻",score:1.5,botoxU:0},
        {name:"假体+耳软骨隆鼻",score:2.0,botoxU:0},
        {name:"硅胶鼻假体取出",score:0.3,botoxU:0},
        {name:"膨体鼻假体取出",score:1.5,botoxU:0},
        {name:"鼻尖成形术",score:1.5,botoxU:0},
        {name:"鼻小柱成形术",score:1.5,botoxU:0},
        {name:"鼻翼肥大矫治",score:1.5,botoxU:0},
        {name:"宽鼻截骨缩窄",score:2.5,botoxU:0},
        {name:"肋软骨隆鼻",score:4.0,botoxU:0}
    ],
    maxillofacial:[
        {name:"隆颏假体法",score:1.5,botoxU:0},
        {name:"颊脂垫祛除",score:1.0,botoxU:0},
        {name:"颞部假体填充",score:1.0,botoxU:0},
        {name:"额部除皱",score:3.5,botoxU:0},
        {name:"颞颊颌颈联合除皱",score:8.0,botoxU:0},
        {name:"颏部截骨",score:4.0,botoxU:0},
        {name:"颧骨截骨",score:4.0,botoxU:0},
        {name:"下颌角截骨",score:4.0,botoxU:0}
    ],
    liposuction:[
        {name:"上臂吸脂",score:2.5,botoxU:0},
        {name:"上腹部吸脂",score:3.0,botoxU:0},
        {name:"下腹部吸脂",score:3.0,botoxU:0},
        {name:"腰部吸脂",score:3.0,botoxU:0},
        {name:"小腿吸脂",score:2.5,botoxU:0},
        {name:"腰腹联合吸脂",score:7.0,botoxU:0},
        {name:"双侧大腿环形吸脂",score:7.0,botoxU:0}
    ],
    fatfill:[
        {name:"额部脂肪填充",score:0.5,botoxU:0},
        {name:"颞部脂肪填充",score:0.5,botoxU:0},
        {name:"泪沟脂肪填充",score:0.3,botoxU:0},
        {name:"面颊脂肪填充",score:0.4,botoxU:0},
        {name:"乳房脂肪填充",score:1.5,botoxU:0}
    ],
    breast:[
        {name:"乳头内陷矫治",score:1.5,botoxU:0},
        {name:"乳头缩小",score:0.8,botoxU:0},
        {name:"乳晕缩小",score:1.5,botoxU:0},
        {name:"假体隆乳",score:3.0,botoxU:0},
        {name:"乳房假体取出",score:2.0,botoxU:0},
        {name:"巨乳缩小",score:5.0,botoxU:0}
    ],
    trunk:[
        {name:"腋臭祛除（侧）",score:1.0,botoxU:0},
        {name:"腹壁成形术",score:10.0,botoxU:0},
        {name:"小型瘢痕切除",score:1.5,botoxU:0}
    ],
    private:[
        {name:"小阴唇整形",score:1.5,botoxU:0},
        {name:"阴道紧缩术",score:2.0,botoxU:0},
        {name:"阴茎延长",score:2.0,botoxU:0}
    ],
    inject:[
        {name:"肉毒毒素注射 100U",score:0.5,botoxU:100},
        {name:"填充剂注射 0.5ml",score:0.5,botoxU:0},
        {name:"美塑注射",score:1.5,botoxU:0},
        {name:"玻璃酸酶溶解",score:0.5,botoxU:0},
        {name:"瘢痕注射",score:0.3,botoxU:0}
    ],
    dermatology:[
        {name:"激光光电治疗",score:0.5,botoxU:0},
        {name:"射频物理治疗",score:0.5,botoxU:0},
        {name:"化学剥脱",score:0.5,botoxU:0},
        {name:"局部皮瓣转移",score:1.5,botoxU:0}
    ]
};

let totalScore = 0;
let totalBotoxU = 0;
let itemList = [];

// 大类联动
document.getElementById('bigCat').addEventListener('change',function(){
    let cat = this.value;
    let subSel = document.getElementById('subItem');
    subSel.innerHTML = '<option value="">请选择具体手术项目</option>';
    if(!cat) return;
    catLib[cat].forEach(item=>{
        let opt = document.createElement('option');
        opt.value = item.score;
        opt.setAttribute('data-botox',item.botoxU);
        opt.textContent = item.name + " ｜指数：" + item.score;
        subSel.appendChild(opt);
    });
});

// 添加项目（修复肉毒素拦截逻辑）
function addItem(){
    let subSel = document.getElementById('subItem');
    let idx = subSel.selectedIndex;
    if(idx<=0){alert("请选择具体手术项目");return;}

    let itemName = subSel.options[idx].text;
    let score = parseFloat(subSel.value);
    let botoxU = parseInt(subSel.options[idx].getAttribute('data-botox')) || 0;

    // 核心：超400U直接弹窗禁止
    if(totalBotoxU + botoxU > BOTOX_MAX_U){
        alert("警告：已超出上海市规范单日肉毒素最大400U限制，无法继续添加！");
        return;
    }

    itemList.push({name:itemName,score:score,botoxU:botoxU});
    totalScore += score;
    totalBotoxU += botoxU;

    renderTable();
    calcResult();
}

// 渲染表格
function renderTable(){
    let tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    itemList.forEach((item,i)=>{
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${item.name}</td>
            <td>${item.score.toFixed(1)}</td>
            <td>${item.botoxU>0 ? item.botoxU+' U' : '-'}</td>
            <td><button class="del-btn" onclick="delItem(${i})">删除</button></td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById('usedU').innerText = totalBotoxU;
}

// 删除项目
function delItem(idx){
    let item = itemList[idx];
    totalScore -= item.score;
    totalBotoxU -= item.botoxU;
    itemList.splice(idx,1);
    renderTable();
    calcResult();
}

// 计算分级+限额
function calcResult(){
    let isNoAnes = document.getElementById('noAnesthesia').checked;
    let limit = isNoAnes ? LIMIT_NO_ANES : LIMIT_ANES;

    document.getElementById('totalScore').innerText = totalScore.toFixed(1);
    document.getElementById('currentLimit').innerText = limit + " 分/次";

    let level = "Ⅰ级美容外科手术";
    if(totalScore>4) level="Ⅱ级";
    if(totalScore>7) level="Ⅲ级";
    if(totalScore>11) level="Ⅳ级高风险整形";
    document.getElementById('surgeryLevel').innerText = level;

    let tip = document.getElementById('limitTip');
    if(totalScore>limit){
        tip.innerText = `已超限，超出${(totalScore-limit).toFixed(1)}分`;
        tip.className = "warn";
    }else{
        tip.innerText = `合规未超限，剩余${(limit-totalScore).toFixed(1)}分`;
        tip.className = "normal";
    }
}

// 清空
function clearAll(){
    totalScore = 0;
    totalBotoxU = 0;
    itemList = [];
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('usedU').innerText = 0;
    document.getElementById('totalScore').innerText = "0.0";
    document.getElementById('limitTip').innerText = "--";
    document.getElementById('surgeryLevel').innerText = "--";
    document.getElementById('bigCat').value = '';
    document.getElementById('subItem').innerHTML = '<option value="">先选择上方手术大类</option>';
}

// 勾选切换自动重算
document.getElementById('noAnesthesia').addEventListener('change',calcResult);
</script>
</body>
</html>
